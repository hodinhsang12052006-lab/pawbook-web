  <title>PawNail</title>
  <!--
    Màn "mất mạng" của app native: capacitor.config.ts server.errorPath.
    Capacitor nạp trang này (từ gói app, không cần mạng) khi không tải được
    https://www.bitpawos.com: máy đang offline, DNS/SSL lỗi hoặc máy chủ không
    trả lời. Không phụ thuộc file nào khác: logo nhúng sẵn (data URI) vì ở hosted mode

  <style>
    :root {
      --bg: #020617;
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(420px 420px at 10% 0%, rgba(192, 38, 211, 0.18), transparent 70%),
        radial-gradient(420px 420px at 90% 100%, rgba(79, 70, 229, 0.18), transparent 70%),
        var(--bg);
      text-align: center;
    }
    main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .logo {
      width: 72px; height: 72px; border-radius: 16px; overflow: hidden;
      border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 12px 32px rgba(80, 7, 36, 0.35);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.1); color: #fbbf24;
    }
    h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 800; }
    h1 span { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; color: #cbd5e1; }
    p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
    p + p { margin-top: 6px; }
    button {
      width: 100%; min-height: 48px; border: 0; border-radius: 16px; cursor: pointer;
      font: inherit; font-size: 15px; font-weight: 700; color: #fff;
      background: linear-gradient(90deg, #9333ea, #4f46e5, #db2777);
      box-shadow: 0 10px 24px rgba(147, 51, 234, 0.28);
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); }
    button[disabled] { opacity: 0.7; }
    .status { min-height: 20px; font-size: 13px; color: var(--muted); }
  </style>
</head>

    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>

  <script>
    (function () {
      var HOME = "https://www.bitpawos.com/";
      var btn = document.getElementById("retry");
      var status = document.getElementById("status");
      var leaving = false;

      function go() {
        if (leaving) return;
        leaving = true;
        btn.disabled = true;
        status.textContent = "Đang kết nối lại… · Reconnecting…";
        location.href = HOME;
      }

      btn.addEventListener("click", go);

      // Tự mở lại khi có mạng. Giới hạn số lần tự thử để không lặp vô hạn nếu
      // website đang lỗi dù máy có mạng (người dùng vẫn bấm Thử lại được).
      var KEY = "pn_offline_auto_retry";
      function canAutoRetry() {
        try {
          var now = Date.now();
          var list = JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 60000; });
          if (list.length >= 2) return false;
          list.push(now);
          sessionStorage.setItem(KEY, JSON.stringify(list));
          return true;
        } catch (e) {
          return false;
        }
      }

      function probe() {
        if (leaving || document.hidden || navigator.onLine === false) return;
        fetch(HOME + "manifest.json", { mode: "no-cors", cache: "no-store" })
          .then(function () { if (canAutoRetry()) go(); })
          .catch(function () {});
      }

      window.addEventListener("online", probe);
      document.addEventListener("visibilitychange", probe);
      setInterval(probe, 8000);
      setTimeout(probe, 1500);
    })();
  </script>
</body>
</html>
