  <!--
    Màn "mất mạng" của app native: capacitor.config.ts server.errorPath.
    Capacitor nạp trang này (từ gói app, không cần mạng) khi không tải được

  <style>
    :root {
      --bg: #1c1521;
      --text: #f6f0f5;
      --muted: #c2b7bf;
      --line: rgba(255, 240, 246, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background:
        radial-gradient(560px 400px at 80% -10%, rgba(219, 39, 119, 0.18), transparent 62%),
        linear-gradient(180deg, #241b29 0, var(--bg) 32rem);
      background-color: var(--bg);
      text-align: center;
    }
    main { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .logo {
      width: 72px; height: 72px; border-radius: 16px; overflow: hidden;
      box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(8, 4, 10, 0.6);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .icon {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(245, 158, 11, 0.35); background: rgba(245, 158, 11, 0.1); color: #fbbf24;
    }
    h1 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 600; }
    h1 span { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--muted); }
    p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
    p + p { margin-top: 6px; }
    button {
      width: 100%; min-height: 52px; border: 0; border-radius: 999px; cursor: pointer;
      font: inherit; font-size: 16px; font-weight: 600; color: #fff;
      background: linear-gradient(180deg, #db2777 0%, #c81f6c 100%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 10px 28px -12px rgba(219, 39, 119, 0.65);
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); }
    button[disabled] { opacity: 0.7; }
    .status { min-height: 20px; font-size: 13px; color: var(--muted); }
  </style>

  </main>

  <script>
    (function () {
      var HOME = "https://www.bitpawos.com/";
      var btn = document.getElementById("retry");
      var status = document.getElementById("status");
      var leaving = false;

      function go() {
        if (leaving) return;
        leaving = true;
        btn.disabled = true;
        status.textContent = "Reconnecting… · Đang kết nối lại…";
        location.href = HOME;
      }

      btn.addEventListener("click", go);

      // Tự mở lại khi có mạng. Giới hạn số lần tự thử để không lặp vô hạn nếu
      // website đang lỗi dù máy có mạng (người dùng vẫn bấm Thử lại được).
      var KEY = "pn_offline_auto_retry";
      function canAutoRetry() {
        try {
          var now = Date.now();
          var list = JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 60000; });
          if (list.length >= 2) return false;
          list.push(now);
          sessionStorage.setItem(KEY, JSON.stringify(list));
          return true;
        } catch (e) {
          return false;
        }
      }

      function probe() {
        if (leaving || document.hidden || navigator.onLine === false) return;
        fetch(HOME + "manifest.json", { mode: "no-cors", cache: "no-store" })
          .then(function () { if (canAutoRetry()) go(); })
          .catch(function () {});
      }

      window.addEventListener("online", probe);
      document.addEventListener("visibilitychange", probe);
      setInterval(probe, 8000);
      setTimeout(probe, 1500);
    })();
  </script>
</body>
</html>
