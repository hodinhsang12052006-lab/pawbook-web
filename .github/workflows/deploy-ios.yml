name: Deploy iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version (CFBundleShortVersionString), e.g. 1.1.0. Empty = keep MARKETING_VERSION from App.xcodeproj."
        required: false
        type: string

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-ios:
    name: Build & Upload iOS (.ipa) to TestFlight
    # App Store Connect only accepts builds made with Xcode 26+ / iOS 26 SDK (since 2026-04-28).
    # macos-14 only has Xcode 15/16 and is retired on 2026-11-02.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Hosted mode: the app loads https://www.bitpawos.com, the bundled web assets are only
      # native-shell/ (loader + offline page). No Next.js build is needed here, and none of
      # the production secrets (DATABASE_URL etc.) may be passed into this job.
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Set up Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Cache Fastlane Ruby gems
        uses: actions/cache@v4
        with:
          path: ios/App/vendor/bundle
          key: ${{ runner.os }}-fastlane-gems-${{ hashFiles('ios/App/Gemfile', 'ios/App/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-fastlane-gems-

      - name: Install Fastlane via Bundler
        working-directory: ios/App
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build signed .ipa & upload to TestFlight via Fastlane Pilot
        working-directory: ios/App
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_PRIVATE_KEY: ${{ secrets.APP_STORE_PRIVATE_KEY }}
          # The ONE Apple Distribution certificate (.p12, base64) reused on every run.
          # Without it fastlane `cert` created a new certificate per run until Apple's cap.
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          APP_VERSION: ${{ inputs.app_version }}
        run: bundle exec fastlane deploy

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PawNailJobs-ipa-${{ github.run_number }}
          path: ios/App/build/*.ipa
          if-no-files-found: ignore
          retention-days: 7

