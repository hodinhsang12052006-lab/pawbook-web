apply plugin: 'com.android.application'

// Khoá ký bản phát hành đọc từ android/keystore.properties (gitignored, chỉ có trên máy
// build). Mẫu: android/keystore.properties.example. KHÔNG ghi mật khẩu vào file này:
// repo đang public. Không có file đó thì bản release ra chưa ký (Android Studio >
// Generate Signed App Bundle vẫn tự ký được).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
} else if (System.getenv('PAWNAIL_KEYSTORE_FILE')) {
    // Không có keystore.properties: đọc từ biến môi trường (scripts/android/build-release.ps1
    // hỏi mật khẩu rồi chỉ đặt biến cho tiến trình Gradle). KHÔNG in các giá trị này ra log.
    keystoreProperties['storeFile'] = System.getenv('PAWNAIL_KEYSTORE_FILE')
    keystoreProperties['storePassword'] = System.getenv('PAWNAIL_KEYSTORE_PASSWORD') ?: ''
    keystoreProperties['keyAlias'] = System.getenv('PAWNAIL_KEY_ALIAS') ?: ''
    keystoreProperties['keyPassword'] = System.getenv('PAWNAIL_KEY_PASSWORD') ?: (System.getenv('PAWNAIL_KEYSTORE_PASSWORD') ?: '')
}
def hasReleaseKeystore = keystoreProperties['storeFile'] ? true : false

android {
    namespace = "com.bitpawos.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bitpawos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode phải lớn hơn MỌI bản đã tải lên Play (mọi track) — xem App bundle
        // explorer. Bản 1 / "1.0" đã nằm trong AAB 28/10/2026; bản 2 / "1.1.0" chưa có Firebase.
        // Bản 3 / "1.2.0": thông báo tin nhắn kiểu Messenger (PawNailMessagingService, bong bóng
        // chat, trả lời nhanh). Máy chủ chỉ gửi tin chat data-only cho build >= 3
        // (NATIVE_RICH_CHAT_MIN_BUILD) — KHÔNG hạ versionCode của bản có service này.
        // Giữ versionName khớp MARKETING_VERSION bên iOS (ios/App/App.xcodeproj, vẫn 1.1.0 —
        // nâng lên 1.2.0 ở bản iOS kế tiếp).
        versionCode 3
        versionName "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                // Đường dẫn storeFile tính từ thư mục android/app/.
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // PawNailMessagingService kế thừa FirebaseMessagingService (qua service của plugin
    // push-notifications, plugin đó chỉ khai báo firebase-messaging là implementation nên app
    // phải tự khai để biên dịch). Cùng phiên bản với plugin: variables.gradle.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
